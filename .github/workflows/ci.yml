# Hosted CI (D-040, D-042): static checks, the fake-Docker unit suite, the package build and a
# pipx installation from the Git checkout. The real rootless Docker campaign is not run here: it
# runs on a disposable machine before every release (docs/engineering/RELEASING.md).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python }}, ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        dependencies: [current, lowest direct]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Private controlled Python runtime
        # Hosted toolcache files/ancestors are world-writable. Success fixtures must meet the
        # updater's real ownership/mode checks, not bypass them or change the shared host cache.
        # Copy the whole installation: a venv or copied binary still uses the original stdlib.
        run: |
          private_python="$(mktemp -d "$HOME/ocs-ci-python.XXXXXX")"
          cp -a "$pythonLocation/." "$private_python/"
          chmod -R go-w "$private_python"
          # Isolated helper children discard LD_LIBRARY_PATH. Relocate only the copied ELF;
          # otherwise GitHub's compiled RUNPATH still loads Python from the original toolcache.
          patchelf --set-rpath "\$ORIGIN/../lib" "$(readlink -f "$private_python/bin/python")"
          private_project="$(mktemp -d "$HOME/ocs-ci-project.XXXXXX")"
          cp -a "$GITHUB_WORKSPACE/." "$private_project/"
          chmod -R go-w "$private_project"
          echo "$private_python/bin" >> "$GITHUB_PATH"
          {
            echo "pythonLocation=$private_python"
            echo "OCS_CI_PROJECT=$private_project"
            # setup-python also exports loader/build paths; none should retain the writable cache.
            echo "LD_LIBRARY_PATH=$private_python/lib"
            echo "PKG_CONFIG_PATH=$private_python/lib/pkgconfig"
            for name in Python_ROOT_DIR Python2_ROOT_DIR Python3_ROOT_DIR; do
              echo "$name=$private_python"
            done
          } >> "$GITHUB_ENV"
      - name: Install
        working-directory: ${{ env.OCS_CI_PROJECT }}
        env:
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' ruff shellcheck-py pyte
          if [ "$DEPENDENCIES" = "lowest direct" ]; then python -m pip install typer==0.16.0 textual==4.0.0; fi
          python -m pip check
          python -m pip list | grep -iE '^(typer|textual|click|rich) '
      - name: External runtime prerequisite
        working-directory: ${{ env.OCS_CI_PROJECT }}
        run: python -m pytest -q tests/test_manager_tools.py::test_observed_external_runtime_and_locations_are_independent_without_installing
      - name: Unit, host and Textual pilot tests (ruff and shellcheck included)
        working-directory: ${{ env.OCS_CI_PROJECT }}
        run: python -m pytest -q -rs -p no:cacheprovider

  arch:
    name: Unit tests (Arch Linux userland)
    # TEMP: shorten Ubuntu diagnosis on develop pushes; restore before final verification.
    if: github.event_name != 'push' || github.ref != 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Not pinned to a digest on purpose: the job tests the current Arch userland (rolling).
    container: archlinux:base-devel # zizmor: ignore[unpinned-images]
    steps:
      - name: Packages
        run: pacman -Syu --noconfirm --needed python git shellcheck
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests as an unprivileged user
        # Several tests check user ownership and permissions: run as a normal user,
        # with the usual umask. The editable source's entire ancestor route must also be owned
        # and controlled; chown of only the mounted workspace leaves foreign-owned ancestors.
        run: |
          umask 022
          useradd --create-home ci
          cp -a "$GITHUB_WORKSPACE" /home/ci/project
          chown -R ci: /home/ci/project
          chmod -R go-w /home/ci/project
          su ci -c 'umask 022 && cd /home/ci/project && python -m venv /home/ci/venv && /home/ci/venv/bin/pip install -q -e ".[test]" ruff pyte \
            && /home/ci/venv/bin/python -m pytest -q -rs -p no:cacheprovider'

  package:
    name: Package build and content (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build --outdir dist .
          python -m twine check --strict dist/*
          python .github/scripts/check_dist.py dist

  pipx:
    name: pipx installation from the checkout (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install with pipx (the documented mechanism, from a git+file URL)
        run: |
          python -m pip install pipx==1.18.7
          echo "PIPX_HOME=$RUNNER_TEMP/pipx" >> "$GITHUB_ENV"
          echo "PIPX_BIN_DIR=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
          PIPX_HOME="$RUNNER_TEMP/pipx" PIPX_BIN_DIR="$RUNNER_TEMP/bin" python -m pipx install --python "$(command -v python)" "git+file://$GITHUB_WORKSPACE"
      - name: Start without a source tree; doctor refuses the runner's daemon
        working-directory: ${{ runner.temp }}
        env:
          # The runner's Docker is rootful: through its default context doctor must exit 4 (mismatch).
          OCS_CI_ROOTFUL_CONTEXT: default
        run: '"$GITHUB_WORKSPACE/.github/scripts/pipx_smoke.sh" "$PIPX_BIN_DIR/opencode-sandbox" "$PIPX_HOME"'

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: actionlint and zizmor
        run: |
          python -m pip install actionlint-py==1.7.12.25 zizmor==1.31.1
          actionlint
          zizmor --offline .github/workflows
