# Weekly (and on demand): build both base images from the Dockerfiles with the manager's own
# build and image verification, to notice upstream breakage (base images, packages, OpenCode on
# npm, the AUR helper) before users do. The images are not published (D-039, D-042).
name: Images

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, arch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build with the newest OpenCode 2.x and verify
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          python -m pip install .
          python .github/scripts/build_image.py "$DISTRO"
