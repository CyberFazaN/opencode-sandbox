# A pushed version tag vX.Y.Z (created by the maintainer, docs/engineering/RELEASING.md): check the
# tag and the CHANGELOG, run CI against the tag, install the tag with pipx, then create a draft
# GitHub Release whose notes are the CHANGELOG section. Nothing is uploaded to a package index and
# no files are attached (D-042); the maintainer reviews and publishes the draft.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tag and CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: The tag equals __version__, and CHANGELOG.md has a dated section
        env:
          TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_check.py "$TAG"

  ci:
    name: CI
    needs: check
    permissions:
      contents: read
    # The self-repository form ($/...) is not accepted by actionlint 1.7.12 yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  pipx-tag:
    name: pipx installation of the tag (Python ${{ matrix.python }})
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the tag with pipx and start it
        env:
          TAG: ${{ github.ref_name }}
          OCS_CI_ROOTFUL_CONTEXT: default
        run: |
          python -m pip install pipx==1.18.7
          export PIPX_HOME="$RUNNER_TEMP/pipx" PIPX_BIN_DIR="$RUNNER_TEMP/bin"
          python -m pipx install --python "$(command -v python)" "git+file://$GITHUB_WORKSPACE@$TAG"
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.github/scripts/pipx_smoke.sh" "$PIPX_BIN_DIR/opencode-sandbox" "$PIPX_HOME" "${TAG#v}"

  draft:
    name: Draft GitHub Release
    needs: [check, ci, pipx-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the draft GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Create the draft
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/scripts/release_check.py "$TAG" "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "OpenCode Sandbox ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
