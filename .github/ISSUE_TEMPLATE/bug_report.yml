name: Bug report
description: Report a defect or unexpected behavior in OpenCode Sandbox.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with OpenCode Sandbox's CLI or terminal dashboard.

        For suspected vulnerabilities, follow [SECURITY.md](https://github.com/CyberFazaN/opencode-sandbox/blob/main/SECURITY.md#reporting-a-vulnerability) instead of opening a public issue.
        Issues are public. Remove API keys, tokens, credentials, private configuration, personal paths and other sensitive details from text, logs and screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem, including the command or dashboard action involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (optional)
      description: If possible, list steps or a small example. For intermittent problems, describe when or how often they happen; exact steps are not required.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment (optional)
      description: Share only what you know. Arch Linux is the tested host; reports from other Linux distributions are welcome too.
      placeholder: |
        Linux distribution and version:
        OpenCode Sandbox version (opencode-sandbox --version):
        Python version:
        Docker version and rootless setup:
        Container image (Debian, Arch or custom):
        Related versions, if relevant (OpenCode, pipx, Typer, Textual):
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Logs, screenshots or additional context (optional)
      description: Share relevant, sanitized excerpts (including `opencode-sandbox doctor`, if useful) or redacted screenshots. Use code fences for logs, not full configuration dumps.
    validations:
      required: false
