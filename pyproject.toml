[build-system]
# 77: SPDX license expressions and license-files (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-sandbox"
dynamic = ["version"]
description = "Run OpenCode coding agents in per-environment containers on your own rootless Docker daemon (unofficial)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CyberFazaN" }]
requires-python = ">=3.14"
dependencies = ["typer>=0.16,<1", "textual>=4.0,<9"]  # lower bounds tested (A04): older typer breaks with click>=8.2, TUI needs textual 4
keywords = ["opencode", "coding-agent", "sandbox", "rootless-docker", "docker", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/CyberFazaN/opencode-sandbox"
Source = "https://github.com/CyberFazaN/opencode-sandbox"
Issues = "https://github.com/CyberFazaN/opencode-sandbox/issues"
Changelog = "https://github.com/CyberFazaN/opencode-sandbox/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
opencode-sandbox = "opencode_sandbox.cli:main"
[tool.setuptools.dynamic]
version = {attr = "opencode_sandbox.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencode_sandbox = ["assets/images/*/*"]

# Quality gate: `ruff check src` reports nothing (tests/test_quality.py).
# Rules: ruff's default rule set (measured with ruff 0.17.3); only these are configured:
[tool.ruff]
target-version = "py314"

[tool.ruff.lint.flake8-bugbear]
# Typer declares options as default values; the call is evaluated once by design (B008).
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# BLE001: a dashboard action or worker catches every error so that the dashboard keeps running;
# each such handler must show it through core.error_text (enforced by tests/test_quality.py).
# RUF012: Textual's BINDINGS class lists (framework convention; never mutated).
"src/opencode_sandbox/*tui.py" = ["BLE001", "RUF012"]
